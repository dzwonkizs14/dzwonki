<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dzwonki ZS14 — Wybór planu i dźwięku</title>
  <style>
    :root {
      --bg: #0d1f17;
      --surface: #142c21;
      --surface-2: #1b3a2c;
      --border: #2b5943;
      --text: #e9f7f0;
      --muted: #9ec5b2;
      --accent: #2ecc71;
      --accent-strong: #22b561;
      --accent-soft: rgba(46, 204, 113, 0.16);
      --shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, sans-serif;
      background: radial-gradient(circle at top, #173628 0%, var(--bg) 65%);
      color: var(--text);
      padding: 2rem 1rem 4rem;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
    }

    header {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: var(--shadow);
      margin-bottom: 1.5rem;
    }

    .badge {
      display: inline-block;
      background: var(--accent-soft);
      color: #7ef0ad;
      border: 1px solid rgba(46, 204, 113, 0.35);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
      margin-bottom: 0.6rem;
    }

    h1 {
      margin: 0 0 0.35rem;
      font-size: 1.65rem;
      letter-spacing: -0.02em;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.4rem;
      box-shadow: var(--shadow);
      margin-bottom: 1.5rem;
    }

    .card h2 {
      margin: 0 0 1rem;
      font-size: 1.15rem;
      color: #b8ebd0;
    }

    .plans-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 0.9rem;
    }

    .plan-option {
      position: relative;
      display: block;
      cursor: pointer;
    }

    .plan-option input[type="radio"] {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .plan-box {
      border: 1.5px solid var(--border);
      background: var(--surface-2);
      border-radius: 12px;
      padding: 1rem;
      transition: border-color 0.15s ease, background 0.15s ease, transform 0.15s ease;
    }

    .plan-option:hover .plan-box {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .plan-option input[type="radio"]:checked + .plan-box {
      border-color: var(--accent);
      background: var(--accent-soft);
      box-shadow: 0 0 0 1px var(--accent);
    }

    .plan-title {
      font-weight: 700;
      font-size: 1.05rem;
      margin-bottom: 0.45rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .plan-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid var(--muted);
      display: inline-block;
    }

    .plan-option input[type="radio"]:checked + .plan-box .plan-dot {
      border-color: var(--accent);
      background: var(--accent);
    }

    .times-group {
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.45;
    }

    .times-group strong {
      color: var(--text);
    }

    .sound-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .sound-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      background: var(--surface-2);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 0.8rem 1rem;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .sound-item.active {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .sound-main {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex: 1;
      cursor: pointer;
    }

    .sound-main input[type="radio"] {
      accent-color: var(--accent);
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .sound-name {
      font-weight: 600;
    }

    .sound-file {
      color: var(--muted);
      font-size: 0.85rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .btn {
      background: var(--accent);
      color: #072013;
      border: none;
      border-radius: 10px;
      padding: 0.55rem 0.95rem;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    .btn:hover {
      background: var(--accent-strong);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: #234b39;
    }

    .status {
      margin-top: 0.75rem;
      font-size: 0.88rem;
      color: #8bf0b3;
      min-height: 1.2em;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <span class="badge">Sterownik dzwonków • Zielony motyw</span>
      <h1>Wybór planu i dźwięku dzwonka</h1>
      <p class="subtitle">Wybierz aktywny plan (<code>a</code>, <code>b</code> lub <code>c</code>) oraz dźwięk <code>dzwonek</code>, który ma być odtwarzany.</p>
    </header>

    <section class="card">
      <h2>1. Wybierz plan</h2>
      <div class="plans-grid" id="plansContainer">
        <label class="plan-option">
          <input type="radio" name="plan" value="a" checked />
          <div class="plan-box">
            <div class="plan-title">
              <span>Plan A</span>
              <span class="plan-dot"></span>
            </div>
            <div class="times-group">
              <strong>Lekcje:</strong> 7:10, 8:00, 8:50, 9:40, 10:35, 11:30, 12:35, 13:35, 14:25, 15:15, 16:05<br />
              <strong>Przerwy:</strong> 7:55, 8:45, 9:35, 10:25, 11:20, 12:15, 13:20, 14:20, 15:15, 16:00
            </div>
          </div>
        </label>

        <label class="plan-option">
          <input type="radio" name="plan" value="b" />
          <div class="plan-box">
            <div class="plan-title">
              <span>Plan B</span>
              <span class="plan-dot"></span>
            </div>
            <div class="times-group">
              <strong>Lekcje:</strong> 7:25, 8:00, 8:35, 9:10, 9:45, 10:25, 11:10, 11:55, 12:30, 13:05, 13:40<br />
              <strong>Przerwy:</strong> 7:55, 8:30, 9:05, 9:40, 10:15, 10:55, 11:40, 12:25, 13:00, 13:35, 14:10
            </div>
          </div>
        </label>

        <label class="plan-option">
          <input type="radio" name="plan" value="c" />
          <div class="plan-box">
            <div class="plan-title">
              <span>Plan C</span>
              <span class="plan-dot"></span>
            </div>
            <div class="times-group">
              <strong>Lekcje:</strong> 7:10, 8:00, 8:50, 9:40, 10:35, 11:30, 12:30, 13:15, 13:50, 14:25, 15:05<br />
              <strong>Przerwy:</strong> 7:55, 8:45, 9:35, 10:25, 11:20, 12:15, 13:00, 13:45, 14:20, 14:55, 15:05
            </div>
          </div>
        </label>
      </div>
    </section>

    <section class="card">
      <h2>2. Wybierz dźwięk (<code>dzwonek</code>)</h2>
      <ul class="sound-list" id="soundList"></ul>
      <audio id="audioPlayer" preload="none"></audio>
      <div class="status" id="statusMessage"></div>
    </section>
  </div>

  <script>
    const GITHUB_OWNER = "YOUR_GITHUB_USERNAME";
    const GITHUB_REPO = "YOUR_REPO_NAME";
    const GITHUB_BRANCH = "main";
    const JSON_PATH = "dzwonki.json";
    // Fine-grained PAT scoped to this single repo with Contents: Read and write.
    // Note: client-side tokens are visible in browser DevTools; use a serverless relay for public access.
    const GITHUB_TOKEN = "github_pat_YOUR_TOKEN_HERE";

    // Dodaj lub usuń numery dźwięków, aby pasowały do plików w folderze "dzwonki/" (np. 1.mp3, 2.mp3, 3.mp3)
    const SOUNDS = [
      { id: "1", label: "Dzwonek 1", file: "dzwonki/1.mp3" },
      { id: "2", label: "Dzwonek 2", file: "dzwonki/2.mp3" },
      { id: "3", label: "Dzwonek 3", file: "dzwonki/3.mp3" },
      { id: "4", label: "Dzwonek 4", file: "dzwonki/4.mp3" },
      { id: "5", label: "Dzwonek 5", file: "dzwonki/5.mp3" }
    ];

    const soundListEl = document.getElementById("soundList");
    const statusEl = document.getElementById("statusMessage");
    const audioPlayer = document.getElementById("audioPlayer");

    let selectedSound = SOUNDS[0].id;
    let saveTimer = null;

    function getSelectedPlan() {
      const checked = document.querySelector('input[name="plan"]:checked');
      return checked ? checked.value : "a";
    }

    function toBase64Utf8(str) {
      const bytes = new TextEncoder().encode(str);
      let bin = "";
      for (const b of bytes) bin += String.fromCharCode(b);
      return btoa(bin);
    }

    function fromBase64Utf8(b64) {
      const clean = b64.replace(/\n/g, "");
      const bin = atob(clean);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return new TextDecoder().decode(bytes);
    }

    function applyConfigToUi(plan, dzwonek) {
      const validPlan = ["a", "b", "c"].includes(plan) ? plan : "a";
      const planRadio = document.querySelector(`input[name="plan"][value="${validPlan}"]`);
      if (planRadio) planRadio.checked = true;

      const validSound = SOUNDS.some((s) => s.id === String(dzwonek)) ? String(dzwonek) : SOUNDS[0].id;
      selectedSound = validSound;
      const soundRadio = document.querySelector(`input[name="dzwonek"][value="${validSound}"]`);
      if (soundRadio) soundRadio.checked = true;
      updateActiveSound();
    }

    async function loadInitialConfigFromGitHub() {
      if (
        GITHUB_OWNER === "YOUR_GITHUB_USERNAME" ||
        GITHUB_REPO === "YOUR_REPO_NAME" ||
        GITHUB_TOKEN === "github_pat_YOUR_TOKEN_HERE"
      ) {
        statusEl.textContent = "Uzupełnij GITHUB_OWNER, GITHUB_REPO oraz GITHUB_TOKEN w kodzie strony.";
        return;
      }

      const apiUrl = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${JSON_PATH}?ref=${encodeURIComponent(GITHUB_BRANCH)}&_=${Date.now()}`;
      try {
        const res = await fetch(apiUrl, {
          headers: {
            "Authorization": `Bearer ${GITHUB_TOKEN}`,
            "Accept": "application/vnd.github+json"
          }
        });
        if (!res.ok) return;
        const fileData = await res.json();
        if (!fileData.content) return;
        const parsed = JSON.parse(fromBase64Utf8(fileData.content));
        applyConfigToUi(parsed.plan, parsed.dzwonek);
        statusEl.textContent = `Wczytano: plan=${getSelectedPlan().toUpperCase()}, dzwonek=${selectedSound}.`;
      } catch (_) {
        // Keep defaults if file doesn't exist yet or offline
      }
    }

    async function syncConfigToGitHub() {
      if (
        GITHUB_OWNER === "YOUR_GITHUB_USERNAME" ||
        GITHUB_REPO === "YOUR_REPO_NAME" ||
        GITHUB_TOKEN === "github_pat_YOUR_TOKEN_HERE"
      ) {
        statusEl.textContent = "Błąd: uzupełnij GITHUB_OWNER, GITHUB_REPO oraz GITHUB_TOKEN w kodzie.";
        return;
      }

      const payloadObj = {
        plan: getSelectedPlan(),
        dzwonek: String(selectedSound)
      };
      const apiUrl = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${JSON_PATH}`;
      const headers = {
        "Authorization": `Bearer ${GITHUB_TOKEN}`,
        "Accept": "application/vnd.github+json",
        "Content-Type": "application/json"
      };

      statusEl.textContent = "Zapisywanie konfiguracji na GitHub...";

      try {
        let sha = undefined;
        const getRes = await fetch(`${apiUrl}?ref=${encodeURIComponent(GITHUB_BRANCH)}&_=${Date.now()}`, { headers });
        if (getRes.ok) {
          const existing = await getRes.json();
          sha = existing.sha;
        }

        const body = {
          message: `Update bell config: plan=${payloadObj.plan}, dzwonek=${payloadObj.dzwonek}`,
          content: toBase64Utf8(JSON.stringify(payloadObj, null, 2) + "\n"),
          branch: GITHUB_BRANCH,
          ...(sha ? { sha } : {})
        };

        const putRes = await fetch(apiUrl, {
          method: "PUT",
          headers,
          body: JSON.stringify(body)
        });

        if (!putRes.ok) {
          const errText = await putRes.text();
          throw new Error(`HTTP ${putRes.status}: ${errText}`);
        }

        statusEl.textContent = `Zapisano: plan=${payloadObj.plan.toUpperCase()}, dzwonek=${payloadObj.dzwonek}.`;
      } catch (err) {
        statusEl.textContent = `Błąd zapisu na GitHub: ${err.message}`;
      }
    }

    function scheduleSync() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(syncConfigToGitHub, 250);
    }

    function updateActiveSound() {
      document.querySelectorAll(".sound-item").forEach((item) => {
        item.classList.toggle("active", item.dataset.soundId === selectedSound);
      });
    }

    function renderSounds() {
      soundListEl.innerHTML = "";

      SOUNDS.forEach((sound, index) => {
        const li = document.createElement("li");
        li.className = "sound-item" + (sound.id === selectedSound ? " active" : "");
        li.dataset.soundId = sound.id;

        const mainLabel = document.createElement("label");
        mainLabel.className = "sound-main";

        const radio = document.createElement("input");
        radio.type = "radio";
        radio.name = "dzwonek";
        radio.value = sound.id;
        radio.checked = index === 0;
        radio.addEventListener("change", () => {
          selectedSound = sound.id;
          updateActiveSound();
          scheduleSync();
        });

        const nameSpan = document.createElement("span");
        nameSpan.className = "sound-name";
        nameSpan.textContent = sound.label;

        const fileSpan = document.createElement("span");
        fileSpan.className = "sound-file";
        fileSpan.textContent = sound.file;

        mainLabel.append(radio, nameSpan, fileSpan);

        const previewBtn = document.createElement("button");
        previewBtn.type = "button";
        previewBtn.className = "btn btn-secondary";
        previewBtn.textContent = "Podgląd";
        previewBtn.addEventListener("click", () => {
          audioPlayer.src = sound.file;
          audioPlayer.play()
            .then(() => {
              statusEl.textContent = `Odtwarzanie podglądu: ${sound.file}`;
            })
            .catch(() => {
              statusEl.textContent = `Nie udało się odtworzyć ${sound.file} (upewnij się, że plik istnieje w dzwonki/).`;
            });
        });

        li.append(mainLabel, previewBtn);
        soundListEl.appendChild(li);
      });
    }

    document.querySelectorAll('input[name="plan"]').forEach((radio) => {
      radio.addEventListener("change", scheduleSync);
    });

    renderSounds();
    loadInitialConfigFromGitHub();
  </script>
</body>
</html>
